[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
markers =
    real_trending_picture: the test supplies Trending Topics' picture step itself (conftest otherwise gives every trend a made-up photo)
    real_preview: the test supplies its own article pages to app/newsdesk/preview (conftest otherwise keeps previews offline)
