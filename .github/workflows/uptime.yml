# Price Chat / Kiwi VPN external uptime monitor.
#
# Runs on GitHub's machines, outside Railway, so it still speaks when the backend, its scheduler or its own owner alerts (Telegram)
# are down. Every check is a read-only request to a public address: nothing here logs in or changes anything.
#
# When a check fails it opens (or updates) ONE GitHub issue labelled "uptime" with the built-in GITHUB_TOKEN, so the repository owner
# gets GitHub's e-mail even if Telegram is down. The issue is updated when the set of failures changes (and every REMIND_HOURS while it
# lasts), and closed with a "recovered" comment when every check passes again. The open issue is the state between runs (no cache).
# A failing run also exits 1 (GitHub's own "run failed" e-mail).
#
# Optional, a second channel on Telegram (skipped when either secret is missing; nothing else needs a secret):
#   UPTIME_TELEGRAM_BOT_TOKEN  a bot token (a separate bot from @BotFather is best, so a problem with the main bot can't silence this one)
#   UPTIME_TELEGRAM_CHAT_ID    the owner's numeric Telegram user id (press Start in a private chat with that bot once)
# Optional repository variable UPTIME_PROXIES (space-separated host:port list) overrides the browser proxies checked below.
#
# Cost: one job of well under a minute per run, billed as 1 minute: every 15 min = 96 runs/day, about 2,900 Actions minutes a month on a
# private repository (GitHub Pro includes 3,000). See docs/hardening/MONITORING-OWNER-SETUP.md (section C) for the budget.
# Local proof without GitHub: python ops/uptime/selftest.py --path <folder with jq>

name: Uptime

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 min, off the top of the hour (GitHub delays busy slots); runs only from the default branch
  workflow_dispatch: {}

permissions: {}  # nothing by default; the job below asks only for issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # worst case (everything down): each GET 3 tries x 15 s, the proxies and TLS reads: about 5 min
    permissions:
      issues: write  # open / comment on / close the "uptime" issue (and create its label once)
    env:
      SITE: https://pricechat.live
      API: https://api.pricechat.live
      PROXIES: ${{ vars.UPTIME_PROXIES || 'hel1.vpn.pricechat.live:443 ash1.vpn.pricechat.live:443' }}
      TLS_HOSTS: pricechat.live api.pricechat.live hel1.vpn.pricechat.live ash1.vpn.pricechat.live
      TLS_MIN_DAYS: "21"
      REMIND_HOURS: "6"
      ISSUE_LABEL: uptime
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TG_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
      TG_API: https://api.telegram.org  # ops/uptime/selftest.py points this at a local fake Bot API
    steps:
      - name: Check
        id: check
        shell: bash
        run: |
          set -uo pipefail
          fails=()
          fail() { fails+=("$1"); echo "FAIL: $1"; }
          ok() { echo "ok:   $1"; }
          get() { curl -sS -m 15 --retry 2 --retry-delay 5 -A "pricechat-uptime/1" -o body.txt -w "%{http_code}" "$1" 2>err.txt; true; }  # 000 = no answer

          # 1. the website
          code=$(get "$SITE/")
          [ "$code" = "200" ] && ok "website $code" || fail "website $SITE answered $code $(head -c 120 err.txt)"

          # 2. the backend is up and its database answers (Railway's own liveness probe; it answers 200 with status=degraded too)
          code=$(get "$API/api/health/live")
          live=$(jq -r '.status // "?"' body.txt 2>/dev/null || echo '?')
          [ "$code" = "200" ] && [ "$live" = "ok" ] && ok "api live" || fail "API $API/api/health/live answered $code (status=$live) $(head -c 120 err.txt)"

          # 3. the backend's public health: database, scheduler, failing jobs, nightly backup (26 h)
          code=$(get "$API/api/health/public")
          if [ "$code" = "200" ] || [ "$code" = "503" ]; then
            for f in ok db scheduler jobs backup; do declare "h_$f=$(jq -r ".$f | tostring" body.txt 2>/dev/null || echo '?')"; done
            [ "$h_ok" = "true" ] && ok "api health" || fail "API health: ok=$h_ok db=$h_db scheduler=$h_scheduler"
            [ "$h_jobs" = "failing" ] && fail "API: a background job has failed 3+ runs in a row (Admin > Background jobs)"
            [ "$h_backup" = "old" ] && fail "API: no successful database backup for over 26 h"
          else
            fail "API health answered $code $(head -c 120 err.txt)"
          fi

          # 4. Kiwi VPN public endpoints and each public server's online flag (set by the 5-minute agent sync)
          code=$(get "$API/api/members/vpn/public")
          [ "$code" = "200" ] && jq -e 'has("enabled")' body.txt >/dev/null 2>&1 && ok "vpn public" || fail "VPN /public answered $code"
          code=$(get "$API/api/members/vpn/stats")
          if [ "$code" = "200" ] && jq -e '.servers' body.txt >/dev/null 2>&1; then
            offline=$(jq -r '[.servers[] | select(.online != true) | .name] | join(", ")' body.txt)
            [ -z "$offline" ] && ok "vpn servers online ($(jq '.servers | length' body.txt))" || fail "VPN server(s) offline: $offline"
          else
            fail "VPN /stats answered $code"
          fi

          # 5. browser proxies: an unauthenticated CONNECT must get 407 (the proxy is up and still asks for a key)
          for p in $PROXIES; do
            pc=$(curl -sS -m 15 -o /dev/null -w "%{http_connect}" -p -x "https://$p" https://example.com 2>/dev/null || true)
            [ "$pc" = "407" ] && ok "proxy $p 407" || fail "proxy $p: CONNECT answered '${pc:-nothing}', expected 407"
          done

          # 6. TLS certificates: fail when one expires in fewer than TLS_MIN_DAYS days
          for h in $TLS_HOSTS; do
            end=$(echo | timeout 15 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then fail "TLS $h: no certificate read"; continue; fi
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            [ "$days" -ge "$TLS_MIN_DAYS" ] && ok "tls $h ${days}d" || fail "TLS $h expires in $days day(s) ($end)"
          done

          printf '%s\n' "${fails[@]}" | sed '/^$/d' | sort > now.txt
          echo "count=${#fails[@]}" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the uptime issue
        id: issue
        shell: bash
        run: |
          set -uo pipefail
          cur=$(cat now.txt)
          sha=$(printf '%s' "$cur" | sha256sum | cut -c1-16)
          marker="<!-- uptime-state:$sha -->"
          list=$(sed 's/^/- /' now.txt)
          issue=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty' || true)
          event=""
          if [ -n "$cur" ]; then
            if [ -z "$issue" ]; then
              gh label create "$ISSUE_LABEL" --color B60205 --description "External uptime monitor (.github/workflows/uptime.yml)" >/dev/null 2>&1 || true
              body=$(printf '@%s the external uptime monitor found a problem:\n\n%s\n\nRun: %s\n\nThis issue is updated when the failures change (and every %s h while they last) and closed by itself when every check passes again.\n%s' \
                "$OWNER" "$list" "$RUN_URL" "$REMIND_HOURS" "$marker")
              gh issue create --title "Uptime: Price Chat checks failing" --label "$ISSUE_LABEL" --body "$body" || echo "::warning::could not open the uptime issue"
              event="PROBLEM"
            else
              last=$(gh issue view "$issue" --json body,createdAt,comments --jq \
                '([{body, createdAt}] + [.comments[] | {body, createdAt}]) | map(select(.body | contains("<!-- uptime-state:"))) | last
                 | "\(.createdAt) \(.body | capture("uptime-state:(?<s>[0-9a-f]+)").s)"' 2>/dev/null || true)
              last_at=${last%% *}; last_sha=${last##* }
              age=$(( $(date +%s) - $(date -d "${last_at:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0) ))
              if [ "$last_sha" != "$sha" ]; then
                event="CHANGED"
                body=$(printf '@%s the failures changed:\n\n%s\n\nRun: %s\n%s' "$OWNER" "$list" "$RUN_URL" "$marker")
              elif [ "$age" -ge $(( REMIND_HOURS * 3600 )) ]; then
                event="STILL FAILING"
                body=$(printf 'Still failing:\n\n%s\n\nRun: %s\n%s' "$list" "$RUN_URL" "$marker")
              fi
              if [ -n "$event" ]; then gh issue comment "$issue" --body "$body" || echo "::warning::could not comment on issue #$issue"; fi
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$(printf 'Recovered: every check passes again.\n\nRun: %s' "$RUN_URL")" || true
            gh issue close "$issue" --reason completed || echo "::warning::could not close issue #$issue"
            event="RECOVERED"
          fi
          echo "event=$event" >> "$GITHUB_OUTPUT"
          {
            echo "message<<UPTIME_EOF"
            if [ "$event" = "RECOVERED" ]; then echo "Price Chat uptime: recovered, every check passes again"
            elif [ -n "$event" ]; then echo "Price Chat uptime: $event"; echo "$cur"; fi
            echo "Run: $RUN_URL"
            echo "UPTIME_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alert on Telegram (optional; skipped without the two secrets)
        if: steps.issue.outputs.event != '' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        shell: bash
        env:
          MESSAGE: ${{ steps.issue.outputs.message }}
        run: |
          set -uo pipefail
          code=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "${TG_API}/bot${TG_TOKEN}/sendMessage" \
                   --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${MESSAGE}" -d disable_web_page_preview=true || true)
          [ "$code" = "200" ] || echo "::warning::Telegram did not accept the alert (HTTP $code)"

      - name: Fail the run when a check failed (GitHub e-mails the owner too)
        if: steps.check.outputs.count != '0'
        run: exit 1
