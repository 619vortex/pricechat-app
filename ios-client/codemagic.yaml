# Cloud Mac builds of Kiwi VPN for iPhone.
# No workflow has a trigger: each starts only when someone presses Start in Codemagic.
# Only kiwi-testflight has a publishing section: it uploads to App Store Connect for TestFlight. Start it ONLY with the owner's approval.
# It never submits for App Review, and never sends the build to external testers.
definitions:
  mac: &mac
    instance_type: mac_mini_m2
    max_build_duration: 45
  go: &go
    name: Install Go 1.22.12, checksum checked
    script: |
      set -euo pipefail
      curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.22.12.darwin-arm64.tar.gz
      echo "416c35218edb9d20990b5d8fc87be655d8b39926f15524ea35c66ee70273050d  /tmp/go.tgz" | shasum -a 256 -c -
      mkdir -p "$HOME/kiwi-go"
      tar -C "$HOME/kiwi-go" -xzf /tmp/go.tgz
      # WireGuardKit's Makefile looks in /usr/local/bin, and Xcode doesn't always keep the build's PATH
      sudo mkdir -p /usr/local/bin
      sudo ln -sf "$HOME/kiwi-go/go/bin/go" /usr/local/bin/go
      echo "PATH=$HOME/kiwi-go/go/bin:$PATH" >> "$CM_ENV"
      "$HOME/kiwi-go/go/bin/go" version

workflows:
  # Needs no Apple account. Finds compile errors, and runs the logic tests.
  kiwi-compile:
    name: Kiwi VPN compile check, unsigned
    <<: *mac
    environment:
      xcode: 26.6
    artifacts:
      - build/logs/*.log
    scripts:
      - *go
      - name: Source and project checks
        script: python3 tools/check_sources.py
      - name: Logic tests
        ignore_failure: true
        script: |
          mkdir -p build/logs
          set -o pipefail
          (cd Packages/KiwiCore && swift test) 2>&1 | tee build/logs/swift-test.log || touch build/logs/tests-failed.log
      - name: Compile the app and the tunnel for iPhone, unsigned
        script: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -project KiwiVPN.xcodeproj -scheme KiwiVPN -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO KIWI_COMMIT="$(awk '{print $2}' BUILD-INFO.txt | cut -c1-12)" build 2>&1 | tee build/logs/xcodebuild.log
      - name: Fail if the logic tests failed
        script: test ! -e build/logs/tests-failed.log

  # Needs the Apple Developer account, the App Store Connect key named kiwi, and the kiwi_signing group. Makes an Ad Hoc IPA for the registered iPhone, and uploads it nowhere.
  kiwi-adhoc-ipa:
    name: Kiwi VPN signed Ad Hoc IPA
    <<: *mac
    integrations:
      app_store_connect: kiwi
    environment:
      xcode: 26.6
      groups:
        - kiwi_signing  # CERTIFICATE_PRIVATE_KEY (secret) and KIWI_IPHONE_UDID
    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    scripts:
      - *go
      - name: Source and project checks
        script: python3 tools/check_sources.py
      - name: App IDs, Network Extensions and the iPhone
        script: bash tools/apple-setup.sh
      - name: Keychain
        script: keychain initialize
      - name: Certificate and profiles for the app and its tunnel
        script: |
          # Without --strict-match-identifier, this also covers live.pricechat.kiwivpn.tunnel
          app-store-connect fetch-signing-files live.pricechat.kiwivpn --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa --project KiwiVPN.xcodeproj --scheme KiwiVPN --config Release \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO KIWI_COMMIT=$(awk '{print $2}' BUILD-INFO.txt | cut -c1-12)"
      - name: Check what was signed
        script: bash tools/verify-ipa.sh build/ios/ipa/*.ipa

  # Needs the organization Apple Developer account, the App Store Connect key named kiwi, the kiwi_signing group (CERTIFICATE_PRIVATE_KEY), and
  # the app record in App Store Connect (KIWI_APP_STORE_APPLE_ID in kiwi_signing: the app's Apple ID number, App Information page).
  # Makes an App Store-signed IPA with the next free build number, checks it, and uploads it NOWHERE.
  kiwi-appstore-ipa:
    name: Kiwi VPN App Store IPA (no upload)
    <<: *mac
    integrations:
      app_store_connect: kiwi
    environment:
      xcode: 26.6
      groups:
        - kiwi_signing
    artifacts: &appstore_artifacts
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    scripts: &appstore_scripts
      - *go
      - name: Source and project checks
        script: python3 tools/check_sources.py
      - name: App IDs and Network Extensions
        script: bash tools/apple-setup.sh
      - name: Keychain
        script: keychain initialize
      - name: Distribution certificate and App Store profiles for the app and its tunnel
        script: |
          # Without --strict-match-identifier, this also covers live.pricechat.kiwivpn.tunnel
          app-store-connect fetch-signing-files live.pricechat.kiwivpn --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Next build number
        script: |
          : "${KIWI_APP_STORE_APPLE_ID:?Add KIWI_APP_STORE_APPLE_ID (the app's Apple ID number) to kiwi_signing}"
          LATEST=$(app-store-connect get-latest-build-number "$KIWI_APP_STORE_APPLE_ID" 2>/dev/null || echo 2)
          case "$LATEST" in ''|*[!0-9]*) LATEST=2;; esac
          echo "KIWI_BUILD_NUMBER=$((LATEST + 1))" >> "$CM_ENV"
          echo "Build number: $((LATEST + 1))"
      - name: Build the App Store IPA
        script: |
          xcode-project build-ipa --project KiwiVPN.xcodeproj --scheme KiwiVPN --config Release             --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$KIWI_BUILD_NUMBER KIWI_COMMIT=$(awk '{print $2}' BUILD-INFO.txt | cut -c1-12)"
      - name: Check what was signed
        script: KIWI_IPHONE_UDID= bash tools/verify-ipa.sh build/ios/ipa/*.ipa  # App Store mode, even though kiwi_signing holds the UDID

  # THE ONLY WORKFLOW THAT SENDS ANYTHING TO APPLE. Owner's approval first. The same build as kiwi-appstore-ipa, then an upload to App
  # Store Connect: after Apple's processing it is available to TestFlight INTERNAL testers (team members) only. No external testers, no
  # beta review, no App Review submission.
  kiwi-testflight:
    name: Kiwi VPN TestFlight upload (internal testers only, owner approval)
    <<: *mac
    integrations:
      app_store_connect: kiwi
    environment:
      xcode: 26.6
      groups:
        - kiwi_signing
    artifacts: *appstore_artifacts
    scripts: *appstore_scripts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
