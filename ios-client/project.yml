# A fallback. KiwiVPN.xcodeproj is written by tools/generate_xcodeproj.py on Windows, and no Xcode has opened it yet. If Xcode rejects it, on the Mac run:
#   brew install xcodegen && xcodegen generate
# This describes the same project, and overwrites KiwiVPN.xcodeproj.
name: KiwiVPN
options:
  bundleIdPrefix: live.pricechat
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    KIWI_COMMIT: ""
    CODE_SIGN_STYLE: Automatic
packages:
  WireGuardKit:
    path: Vendor/wireguard-apple
  KiwiCore:
    path: Packages/KiwiCore
targets:
  KiwiVPN:
    type: application
    platform: iOS
    sources:
      - path: KiwiVPN
        excludes: [Info.plist, KiwiVPN.entitlements]
    settings:
      base:
        INFOPLIST_FILE: KiwiVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: KiwiVPN/KiwiVPN.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: live.pricechat.kiwivpn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KiwiCore
      - target: KiwiTunnel
        embed: true
  KiwiTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: KiwiTunnel
        excludes: [Info.plist, KiwiTunnel.entitlements]
    settings:
      base:
        INFOPLIST_FILE: KiwiTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: KiwiTunnel/KiwiTunnel.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: live.pricechat.kiwivpn.tunnel
    dependencies:
      - package: KiwiCore
      - package: WireGuardKit
      - target: WireGuardGoBridgeiOS
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: /usr/bin/make
      arguments: $(ACTION)
      workingDirectory: $(SRCROOT)/Vendor/wireguard-apple/Sources/WireGuardKitGo
      passSettings: true
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos
schemes:
  KiwiVPN:
    build:
      targets:
        KiwiVPN: all
    run:
      config: Debug
    archive:
      config: Release
