[package]
name = "kiwivpn-app"
version = "0.1.0"
edition = "2021"
description = "Kiwi VPN for Windows: the desktop window. It runs as the signed-in person and asks the Kiwi VPN service to do everything privileged."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The service's own library: one definition of the pipe's protocol, used by both ends.
kiwivpn-service = { path = "../../service" }
# Only for the test build's "choose a config file" button.
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[features]
# Connecting from a config file exists until sign-in does (milestone 3). Release builds use --no-default-features.
default = ["test-config"]
test-config = ["dep:tauri-plugin-dialog"]

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
