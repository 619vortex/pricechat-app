[package]
name = "kiwivpn-app"
version = "0.1.0"
edition = "2021"
description = "Kiwi VPN for Windows: the desktop window. It runs as the signed-in person and asks the Kiwi VPN service to do everything privileged."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The service's own library: one definition of the pipe's protocol, used by both ends.
kiwivpn-service = { path = "../../service" }
kiwivpn-client = { path = "../../client" }
# Only for the "use a config file" option in Advanced settings.
tauri-plugin-dialog = { version = "2", optional = true }

[features]
# The config file option stays for testing. A public release is built with --no-default-features, which removes it.
default = ["test-config"]
test-config = ["dep:tauri-plugin-dialog"]

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
