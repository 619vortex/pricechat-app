[package]
name = "kiwivpn-service"
version = "0.1.0"
edition = "2021"
description = "Kiwi VPN's Windows service: runs the tunnel for the app through WireGuard's embeddable tunnel service."

[[bin]]
name = "kiwivpn-service"
path = "src/main.rs"

[lib]
name = "kiwivpn"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc"] }

[profile.release]
strip = true
lto = true
panic = "abort"
