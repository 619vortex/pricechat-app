# Kiwi VPN for Windows: compiles, runs every test, and builds the installer as a private build artifact.
# Lives at .github/workflows/kiwi-windows.yml in the private repo 619vortex/KIWIVPN, whose windows-client/ folder is
# this folder (copied by windows-client/sync-ci-repo.ps1). The iPhone project at that repo's root, and its Codemagic
# workflows, are separate and untouched by this file.
#
# It publishes nothing: no release, no upload anywhere, no website change. It needs no secrets. The installer is NOT
# code signed, so Smart App Control blocks it; it's for testing on a machine without it, until signing is added.
name: Kiwi VPN Windows

on:
  push:
    branches: [main]
    paths:
      - "windows-client/**"
      - ".github/workflows/kiwi-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiwi-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # WireGuard's tunnel library is built from this exact commit, and wireguard.dll comes from WireGuard LLC's signed release.
  WG_COMMIT: 6ece77bc487c8aa697e3c092197621c4f3e5ccb8
  WG_NT_SHA256: DCEB30A9BC4BE48CCE0F74160FC88A585A2C2627366E8F846FC6658F9038DACE
  WIREGUARD_DLL_SHA256: B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
        working-directory: windows-client
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-client/app/package-lock.json

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version; cargo --version

      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('windows-client/**/Cargo.lock', 'windows-client/**/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: WireGuard DLL cache
        id: wgcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-client/dist
          key: wireguard-${{ env.WG_COMMIT }}-${{ env.WG_NT_SHA256 }}

      - name: WireGuard's DLLs, from the pinned commit and the signed release
        if: steps.wgcache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          git clone --quiet https://git.zx2c4.com/wireguard-windows "$env:RUNNER_TEMP\wg"
          git -C "$env:RUNNER_TEMP\wg" checkout --quiet $env:WG_COMMIT
          if ((git -C "$env:RUNNER_TEMP\wg" rev-parse HEAD) -ne $env:WG_COMMIT) { throw "Not the pinned WireGuard commit" }
          cmd /c "$env:RUNNER_TEMP\wg\embeddable-dll-service\build.bat"
          if ($LASTEXITCODE -ne 0) { throw "tunnel.dll didn't build" }
          Copy-Item "$env:RUNNER_TEMP\wg\embeddable-dll-service\amd64\tunnel.dll" dist\
          Invoke-WebRequest -UseBasicParsing https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip -OutFile "$env:RUNNER_TEMP\wgnt.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\wgnt.zip" -Algorithm SHA256).Hash -ne $env:WG_NT_SHA256) { throw "wireguard-nt's download isn't the expected file" }
          Expand-Archive "$env:RUNNER_TEMP\wgnt.zip" "$env:RUNNER_TEMP\wgnt"
          Copy-Item "$env:RUNNER_TEMP\wgnt\wireguard-nt\bin\amd64\wireguard.dll" dist\

      - name: Check WireGuard's DLLs
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-AuthenticodeSignature dist\wireguard.dll).Status -ne "Valid") { throw "wireguard.dll's signature isn't valid" }
          if ((Get-FileHash dist\wireguard.dll -Algorithm SHA256).Hash -ne $env:WIREGUARD_DLL_SHA256) { throw "wireguard.dll isn't the expected file" }
          Get-FileHash dist\*.dll -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      - name: Window tests (React) and type check
        working-directory: windows-client/app
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "The window's tests failed" }
          npx tsc -b
          if ($LASTEXITCODE -ne 0) { throw "The type check failed" }

      - name: Rust tests, service
        working-directory: windows-client/service
        run: |
          cargo test -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "The service's tests failed" }

      - name: Rust tests, client (sign-in, keys, 2.0 options and measurements)
        working-directory: windows-client/client
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "The client's tests failed" }

      - name: End-to-end test tools (e2e.exe, guard_check.exe; not part of the installer)
        working-directory: windows-client/client
        run: |
          cargo build --release --example e2e
          if ($LASTEXITCODE -ne 0) { throw "The test tool didn't build" }
          Push-Location ..\service
          cargo build --release --example guard_check
          if ($LASTEXITCODE -ne 0) { throw "The kill switch test tool didn't build" }
          Pop-Location
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tools" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\examples\e2e.exe", "$env:CARGO_TARGET_DIR\release\examples\guard_check.exe" "$env:GITHUB_WORKSPACE\tools\"

      - name: Service, release build
        working-directory: windows-client/service
        run: |
          cargo build --release --bins
          if ($LASTEXITCODE -ne 0) { throw "The service didn't build" }

      - name: Files the installer bundles (the app's build script checks they exist)
        run: |
          $ErrorActionPreference = "Stop"
          $Bundle = "app\src-tauri\bundle-files"
          New-Item -ItemType Directory -Force $Bundle | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\kiwivpn-service.exe", dist\tunnel.dll, dist\wireguard.dll $Bundle -Force

      - name: Rust tests, app
        working-directory: windows-client/app/src-tauri
        run: |
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          if (-not (Test-Path ..\dist\index.html)) { Set-Content ..\dist\index.html "<!doctype html>" }
          cargo test --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "The app's tests failed" }

      - name: Installer
        run: |
          $ErrorActionPreference = "Stop"
          $Bundle = "app\src-tauri\bundle-files"
          New-Item -ItemType Directory -Force $Bundle | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\kiwivpn-service.exe", dist\tunnel.dll, dist\wireguard.dll $Bundle -Force
          Push-Location app
          # A public-style build: --no-default-features removes the "use a config file" testing option.
          npm run tauri -- build -- --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "The installer didn't build" }
          Pop-Location
          $Built = Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*-setup.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $Built) { throw "No installer was produced" }
          $Version = (Get-Content app\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $Short = "$env:GITHUB_SHA".Substring(0, 7)
          $Name = "KiwiVPN-$Version-$Short-unsigned-Setup.exe"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item $Built.FullName "$env:GITHUB_WORKSPACE\out\$Name"
          $Sha = (Get-FileHash "$env:GITHUB_WORKSPACE\out\$Name" -Algorithm SHA256).Hash
          "$Sha  $Name" | Set-Content "$env:GITHUB_WORKSPACE\out\$Name.sha256" -Encoding ascii
          $Source = if (Test-Path BUILD-INFO.txt) { (Get-Content BUILD-INFO.txt -Raw).Trim() } else { "unknown" }
          @("ci-commit $env:GITHUB_SHA", "source $Source", "version $Version", "run $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "signed no") | Set-Content "$env:GITHUB_WORKSPACE\out\BUILD-INFO.txt" -Encoding ascii
          "### Kiwi VPN $Version for Windows (unsigned test build)`n`nSHA-256 ``$Sha```n`nNot published anywhere. Smart App Control blocks it until it's code signed." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KiwiVPN-Windows-${{ github.sha }}
          path: out/
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KiwiVPN-test-tools-${{ github.sha }}
          path: tools/
          retention-days: 3
          if-no-files-found: error

  # The kill switch and DNS guard on a fresh GitHub Windows machine, with no VPN account: the installed service against a
  # test server that never answers (crash recovery, give-up, pause limit, service restart), then the raw filters (what gets
  # through, what's blocked, and that the block dies with its process). Each block lasts seconds to two minutes.
  kill-switch:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KiwiVPN-Windows-${{ github.sha }}
          path: build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KiwiVPN-test-tools-${{ github.sha }}
          path: tools

      - name: Install the build silently
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build\*-Setup.exe | Select-Object -First 1
          $want = ((Get-Content "$($exe.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash -ne $want) { throw "The installer isn't the one the build made" }
          $p = Start-Process $exe.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          Start-Sleep 5
          if ((Get-Service KiwiVPN).Status -ne "Running") { throw "The Kiwi VPN service isn't running after install" }
          sc.exe qfailure KiwiVPN

      - name: Kill switch through the installed service
        id: service
        continue-on-error: true
        run: |
          tools\guard_check.exe service ks-service-report.json
          if ($LASTEXITCODE -ne 0) { throw "Kill switch service checks failed" }

      - name: Kill switch filters on their own
        id: raw
        continue-on-error: true
        run: |
          tools\guard_check.exe run ks-filters-report.json
          if ($LASTEXITCODE -ne 0) { throw "Kill switch filter checks failed" }

      - name: Service log
        if: always()
        run: |
          $log = "C:\Program Files\KiwiVPN\logs\service.log"
          if (Test-Path $log) { Get-Content $log -Tail 120 }

      - name: Uninstall, and the internet is still there
        if: always()
        run: |
          if (Test-Path "C:\Program Files\KiwiVPN\uninstall.exe") { Start-Process "C:\Program Files\KiwiVPN\uninstall.exe" -ArgumentList "/S" -Wait }
          Start-Sleep 3
          $ok = (Test-NetConnection 1.1.1.1 -Port 443 -WarningAction SilentlyContinue).TcpTestSucceeded
          "internet after uninstall: $ok"
          if (-not $ok) { throw "No internet after uninstalling" }

      - name: Report
        if: always()
        run: |
          $rows = @()
          foreach ($f in "ks-service-report.json", "ks-filters-report.json") { if (Test-Path $f) { $rows += Get-Content $f -Raw | ConvertFrom-Json } }
          $md = "### Kiwi VPN 2.0 kill switch`n`n| Result | Check | Detail |`n|---|---|---|`n"
          foreach ($r in $rows) { $md += "| $($r.result) | $($r.name) | $(($r.detail -replace '\|', '/')) |`n" }
          $md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ("${{ steps.service.outcome }}" -ne "success" -or "${{ steps.raw.outcome }}" -ne "success") { throw "Some kill switch checks failed (see the table)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: KiwiVPN-kill-switch-reports-${{ github.sha }}
          path: ks-*-report.json
          retention-days: 14
          if-no-files-found: ignore

  # Real VPN tests on a fresh GitHub Windows machine: install the build silently, connect to the real Kiwi servers,
  # then drive the real window. Uses the Actions secret KIWI_CI_SESSION (a Kiwi VPN app session: VPN API only, made by
  # windows-client/ci/session-tool/ci-session.mjs). Without it the job says so and does nothing. Its devices are deleted
  # at the end. Nothing is published; the firewall rule used for the failover test exists only on this runner.
  e2e:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    env:
      KIWI_CI_SESSION: ${{ secrets.KIWI_CI_SESSION }}
    steps:
      - name: Session available?
        id: gate
        run: |
          if ($env:KIWI_CI_SESSION) { "run=yes" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii }
          else { "### VPN tests skipped`n`nNo KIWI_CI_SESSION secret yet: run windows-client/ci/session-tool/ci-session.mjs on the main PC." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'yes'
        with:
          persist-credentials: false
          sparse-checkout: windows-client/ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.run == 'yes'
        with:
          name: KiwiVPN-Windows-${{ github.sha }}
          path: build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.run == 'yes'
        with:
          name: KiwiVPN-test-tools-${{ github.sha }}
          path: tools

      - name: Install the build silently, as an administrator would
        if: steps.gate.outputs.run == 'yes'
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build\*-Setup.exe | Select-Object -First 1
          $want = ((Get-Content "$($exe.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash -ne $want) { throw "The installer isn't the one the build made" }
          $p = Start-Process $exe.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          Start-Sleep 5
          Get-Service KiwiVPN | Format-List Name, Status, StartType
          if ((Get-Service KiwiVPN).Status -ne "Running") { throw "The Kiwi VPN service isn't running after install" }
          if (-not (Test-Path "C:\Program Files\KiwiVPN\KiwiVPN.exe")) { throw "KiwiVPN.exe isn't installed" }

      - name: VPN tests (real tunnels, every country, DNS and IPv6 leaks, split tunneling, reconnects, speed)
        id: core
        if: steps.gate.outputs.run == 'yes'
        continue-on-error: true
        run: |
          tools\e2e.exe run e2e-report.json
          if ($LASTEXITCODE -ne 0) { throw "VPN tests failed" }

      - name: Window tests (Smart Connect, automatic failover, Tools, disconnect and reconnect)
        id: ui
        if: steps.gate.outputs.run == 'yes'
        continue-on-error: true
        run: |
          node windows-client\ci\e2e-ui.mjs e2e-ui-report.json
          if ($LASTEXITCODE -ne 0) { throw "Window tests failed" }

      - name: Service log
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          $log = "C:\Program Files\KiwiVPN\logs\service.log"
          if (Test-Path $log) { Get-Content $log -Tail 80 }

      - name: Clean up (disconnect, delete this runner's devices, uninstall)
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          tools\e2e.exe cleanup
          Remove-NetFirewallRule -DisplayName "KiwiCI-failover-block" -ErrorAction SilentlyContinue
          if (Test-Path "C:\Program Files\KiwiVPN\uninstall.exe") { Start-Process "C:\Program Files\KiwiVPN\uninstall.exe" -ArgumentList "/S" -Wait }

      - name: Report
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          $rows = @()
          foreach ($f in "e2e-report.json", "e2e-ui-report.json") { if (Test-Path $f) { $rows += Get-Content $f -Raw | ConvertFrom-Json } }
          $md = "### Kiwi VPN 2.0 end-to-end tests`n`n| Result | Check | Detail |`n|---|---|---|`n"
          foreach ($r in $rows) { $md += "| $($r.result) | $($r.name) | $(($r.detail -replace '\|', '/')) |`n" }
          $md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ("${{ steps.core.outcome }}" -ne "success" -or "${{ steps.ui.outcome }}" -ne "success") { throw "Some end-to-end checks failed (see the table)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.run == 'yes'
        with:
          name: KiwiVPN-e2e-reports-${{ github.sha }}
          path: |
            e2e-report.json
            e2e-ui-report.json
          retention-days: 14
          if-no-files-found: ignore
