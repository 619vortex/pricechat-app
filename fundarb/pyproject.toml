[project]
name = "fundarb"
version = "0.1.0"
description = "Delta-neutral perp-to-perp funding-rate arbitrage across Hyperliquid, Lighter, Orderly and Backpack (Phase 1: read-only)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "websockets>=12",
]

[project.optional-dependencies]
# Phase 4 (execution) only. Pinned on purpose: this exact version is the known-good one (do not float it).
live = ["lighter-sdk==1.1.6"]
test = ["pytest>=8"]

[project.scripts]
fundarb = "fundarb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
